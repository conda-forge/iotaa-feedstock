{% set build = 0 %}
{% set version = "1.8.1" %}

package:
  name: iotaa
  version: {{ version }}

source:
  url: https://github.com/maddenp/iotaa/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 55893fcbb51e27d1d1ffc6ff56f30577ffdc35e95463e242a0f8279009bd0d7d

build:
  entry_points:
    - iotaa = iotaa:main
  noarch: python
  number: {{ build }}

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - iotaa
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - iotaa --help

about:
  home: https://github.com/maddenp/iotaa
  summary: A Simple Workflow Engine
  description: A simple workflow engine expressing tasks as decorated Python functions
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://github.com/maddenp/iotaa/README.md

extra:
  recipe-maintainers:
    - maddenp
